name: Deploy theme to Hostinger

# Runs every time you push to "master".
on:
  push:
    branches: [master]

jobs:
  deploy:
    name: Deploy over SSH (rsync)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load SSH deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Sync files via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude=".gitignore" \
            ./ "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_REMOTE_PATH }}"

      - name: Purge LiteSpeed cache
        run: |
          ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "curl -s -o /dev/null -H 'X-LiteSpeed-Purge: *' -H 'Host: bdcnewsdesk.com' http://127.0.0.1/ || true"
